name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  GOFLAGS: -p=1

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must use vMAJOR.MINOR.PATCH: ${tag}" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "release commit ${GITHUB_SHA} is not on main" >&2
            exit 1
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "release ${tag} already exists; releases are immutable" >&2
            exit 1
          fi

      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Run vet
        run: make vet

      - name: Run tests
        run: make test

      - name: Run lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Build release assets
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ldflags="-s -w -X upskill/internal/version.value=${GITHUB_REF_NAME}"
          mkdir -p dist

          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            archive_base="upskill_${version}_${goos}_${goarch}"
            stage="${RUNNER_TEMP}/${archive_base}"
            binary="upskill"
            if [[ "${goos}" == "windows" ]]; then
              binary="upskill.exe"
            fi

            mkdir -p "${stage}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags "${ldflags}" -o "${stage}/${binary}" ./cmd/upskill
            cp LICENSE README.md "${stage}/"

            if [[ "${goos}" == "windows" ]]; then
              (cd "${stage}" && zip -q "${GITHUB_WORKSPACE}/dist/${archive_base}.zip" "${binary}" LICENSE README.md)
            else
              tar -C "${stage}" -czf "dist/${archive_base}.tar.gz" "${binary}" LICENSE README.md
            fi
          done

          (cd dist && sha256sum upskill_* > checksums.txt)

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "Upskill ${GITHUB_REF_NAME}"
